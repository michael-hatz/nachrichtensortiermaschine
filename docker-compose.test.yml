# Local test setup: builds the image and uses ./testdata (gitignored) as /app/data.
# Start:   docker compose -f docker-compose.test.yml up -d --build
# Run job: docker compose -f docker-compose.test.yml exec nsm python3 /app/nsm.py
services:
  nsm:
    build:
      context: .
      dockerfile: dockerfile
    container_name: nsm-test
    ports:
      - "5050:5000"
    volumes:
      - ./testdata:/app/data
